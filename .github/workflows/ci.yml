name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    # Кросплатформна частина мови (усе, крім GUI/2D/3D-графіки на
    # Windows Forms) — саме те, що реально перевіряє tests/run_all.sh:
    # graphics/http_server-тести там пропускаються на будь-якій ОС.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # EnableWindowsTargeting потрібен навіть для збірки лише net10.0:
      # csproj мультитаргетить net10.0-windows;net10.0, і без цього
      # прапорця restore падає на "To build a project targeting Windows
      # on this operating system, set the EnableWindowsTargeting property
      # to true" ще до того, як дійде до конкретного -f net10.0.
      - name: Build (net10.0)
        run: dotnet build src/ArxLang -f net10.0 -p:EnableWindowsTargeting=true --configuration Release

      - name: Run test suite
        # Абсолютний шлях обов'язковий: run_all.sh сам робить cd у tests/
        # перед тим, як перевірити $ARX_EXE — відносний шлях звідти вже
        # вказував би не туди.
        run: ARX_EXE="$(pwd)/src/ArxLang/bin/Release/net10.0/ArxLang" bash tests/run_all.sh

  build-windows:
    # Окрема перевірка, що WinForms-гілка (#if WINDOWS: guiWindow,
    # createCanvas тощо) досі компілюється — run_all.sh її не зачіпає,
    # бо ці тести пропускаються на всіх ОС однаково.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (net10.0-windows)
        run: dotnet build src/ArxLang -f net10.0-windows --configuration Release
